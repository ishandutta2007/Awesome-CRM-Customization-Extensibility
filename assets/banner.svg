<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accent-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef"/>
      <stop offset="100%" stop-color="#7579ff"/>
    </linearGradient>

    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    .orb-anim1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 15% 25%; }
    .orb-anim2 { animation: pulseOrb 9s ease-in-out infinite alternate; transform-origin: 85% 75%; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill1 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPill2 6.5s ease-in-out infinite 0.5s; }
    .flow-path { stroke-dasharray: 8 8; animation: flowLine 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Glowing Orbs (Dynamic in Background) -->
  <circle class="orb-anim1" cx="180" cy="100" r="220" fill="url(#glow-1)"/>
  <circle class="orb-anim2" cx="1020" cy="260" r="260" fill="url(#glow-2)"/>

  <!-- Subtle Tech Grid -->
  <rect width="100%" height="100%" fill="url(#grid-pattern)"/>

  <!-- Connecting Workflow Lines in Background -->
  <g opacity="0.35">
    <path class="flow-path" d="M 100 80 Q 300 20 600 80 T 1100 80" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path class="flow-path" d="M 80 290 Q 400 340 700 280 T 1120 290" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  </g>

  <!-- Foreground Title and Branding (Crisp & High Contrast) -->
  <g id="main-heading">
    <!-- Super Title Tag -->
    <g transform="translate(600, 75)" text-anchor="middle">
      <rect x="-180" y="-18" width="360" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text y="4" font-size="12" font-weight="700" letter-spacing="2" fill="#38bdf8">⚡ ENTERPRISE EXTENSIBILITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-size="44" font-weight="900" letter-spacing="-1" fill="url(#primary-grad)" filter="url(#shadow)">
      Awesome CRM Customization &amp; Extensibility
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="185" text-anchor="middle" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">
      Curated Landscape of SaaS Marketplaces, iPaaS Engines &amp; Open-Source Workflow Platforms
    </text>
  </g>

  <!-- Dynamic Feature Badges / Floating Interactive Nodes (Bottom Row) -->
  <g id="feature-pills" transform="translate(0, 245)">
    <!-- Pill 1: Workflow Automation -->
    <g class="pill-1" transform="translate(140, 0)">
      <rect x="0" y="0" width="200" height="48" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="26" cy="24" r="8" fill="#38bdf8" fill-opacity="0.2"/>
      <circle cx="26" cy="24" r="4" fill="#38bdf8"/>
      <text x="44" y="29" font-size="13" font-weight="600" fill="#f1f5f9">Workflow Automation</text>
    </g>

    <!-- Pill 2: App Marketplaces -->
    <g class="pill-2" transform="translate(370, 0)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="26" cy="24" r="8" fill="#818cf8" fill-opacity="0.2"/>
      <circle cx="26" cy="24" r="4" fill="#818cf8"/>
      <text x="44" y="29" font-size="13" font-weight="600" fill="#f1f5f9">App Marketplaces</text>
    </g>

    <!-- Pill 3: Low-Code / Pro-Code -->
    <g class="pill-3" transform="translate(580, 0)">
      <rect x="0" y="0" width="180" height="48" rx="24" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="26" cy="24" r="8" fill="#c084fc" fill-opacity="0.2"/>
      <circle cx="26" cy="24" r="4" fill="#c084fc"/>
      <text x="44" y="29" font-size="13" font-weight="600" fill="#f1f5f9">Low-Code &amp; iPaaS</text>
    </g>

    <!-- Pill 4: Open Source Extensibility -->
    <g class="pill-4" transform="translate(790, 0)">
      <rect x="0" y="0" width="270" height="48" rx="24" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)"/>
      <circle cx="26" cy="24" r="8" fill="#4ade80" fill-opacity="0.2"/>
      <circle cx="26" cy="24" r="4" fill="#4ade80"/>
      <text x="44" y="29" font-size="13" font-weight="600" fill="#f1f5f9">Self-Hosted &amp; Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="100%" height="4" fill="url(#primary-grad)"/>
</svg>
